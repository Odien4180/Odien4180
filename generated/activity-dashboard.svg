<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 330">
  <title id="title">Development Pulse</title>
  <desc id="desc">Public and private development activity metrics.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="0.55" stop-color="#2563eb" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .card { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .title { font-size: 24px; font-weight: 750; fill: #0f172a; letter-spacing: -0.4px; }
    .eyebrow { font-size: 10px; font-weight: 700; fill: #7c3aed; letter-spacing: 1.8px; }
    .sub { font-size: 12px; font-weight: 500; fill: #64748b; }
    .number { font-size: 34px; font-weight: 750; fill: #0f172a; }
    .label { font-size: 12px; font-weight: 650; fill: #64748b; }
    .status { font-size: 10px; font-weight: 700; fill: #047857; letter-spacing: .8px; }
    .status-bg { fill: #d1fae5; }
    .narrative { font-size: 13px; font-weight: 600; fill: #334155; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .title, .number { fill: #f0f6fc; }
      .sub, .label { fill: #8b949e; }
      .eyebrow { fill: #a78bfa; }
      .status-bg { fill: #064e3b; }
      .status { fill: #6ee7b7; }
      .narrative { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="330" rx="18" />
  <rect x="0" y="0" width="900" height="5" rx="2.5" fill="url(#accent)" />
  <text class="eyebrow" x="30" y="34">GITHUB ACTIVITY</text>
  <text class="title" x="30" y="64">Development Pulse</text>
  <text class="sub" x="30" y="86">2026-08-13 ~ 2026-08-14</text>
  <rect class="status-bg" x="786" y="30" width="84" height="26" rx="13" />
  <text class="status" x="828" y="47" text-anchor="middle">ACTIVE</text>
  <rect class="card" x="30" y="112" width="194" height="118" rx="14" />
  <text class="label" x="48" y="143">PUBLIC COMMITS</text>
  <text class="number" x="48" y="190">0</text>
  <rect x="48" y="207" width="42" height="3" rx="1.5" fill="url(#accent)" />
  <rect class="card" x="246" y="112" width="194" height="118" rx="14" />
  <text class="label" x="264" y="143">PRIVATE COMMITS</text>
  <text class="number" x="264" y="190">69</text>
  <rect x="264" y="207" width="42" height="3" rx="1.5" fill="url(#accent)" />
  <rect class="card" x="462" y="112" width="194" height="118" rx="14" />
  <text class="label" x="480" y="143">ACTIVE REPOSITORIES</text>
  <text class="number" x="480" y="190">1</text>
  <rect x="480" y="207" width="42" height="3" rx="1.5" fill="url(#accent)" />
  <rect class="card" x="678" y="112" width="194" height="118" rx="14" />
  <text class="label" x="696" y="143">MERGED PRS</text>
  <text class="number" x="696" y="190">0</text>
  <rect x="696" y="207" width="42" height="3" rx="1.5" fill="url(#accent)" />
  <text class="sub" x="30" y="302">Updated · 2026-08-14 07:26 KST</text>
  <text class="sub" x="870" y="302" text-anchor="end">github-activity-reporter</text>
</svg>
